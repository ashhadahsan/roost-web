[project]
name = "roost-web"
version = "0.1.0"
description = "Dashboard for Roost — the Postgres-backed background job queue."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ashhad Ahsan", email = "ashhadahsan@gmail.com" },
]
keywords = [
    "postgres",
    "queue",
    "jobs",
    "background",
    "worker",
    "dashboard",
    "roost",
    "oban",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pgroost>=0.1.1,<0.2",  # imports roost._core: pin to the minor it was tested with
    "starlette>=0.45.0",
    "jinja2>=3.1.0",
    "asyncpg>=0.31.0",
    "anyio>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/ashhadahsan/roost-web"
Issues = "https://github.com/ashhadahsan/roost-web/issues"
Changelog = "https://github.com/ashhadahsan/roost-web/blob/main/CHANGELOG.md"
"Roost (core)" = "https://github.com/ashhadahsan/roost"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.8",
    "uvicorn>=0.32",
]
