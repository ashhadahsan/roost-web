[project]
name = "roost-web"
version = "0.1.0.dev0"
description = "Dashboard for Roost — the Postgres-backed background job queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ashhad Ahsan", email = "ashhadahsan@gmail.com" },
]
keywords = [
    "postgres",
    "queue",
    "jobs",
    "background",
    "worker",
    "dashboard",
    "roost",
    "oban",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pgroost>=0.1.0.dev0",
    "starlette>=0.45.0",
    "jinja2>=3.1.0",
    "asyncpg>=0.31.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
]

[tool.uv.sources]
# Local development — picks up ../roost (PyPI dist name is pgroost).
# CI / PyPI installs the published pgroost.
pgroost = { path = "../roost", editable = true }

[project.urls]
Homepage = "https://github.com/ashhadahsan/roost-web"
Documentation = "https://roost-web.readthedocs.io"
Issues = "https://github.com/ashhadahsan/roost-web/issues"
Changelog = "https://github.com/ashhadahsan/roost-web/blob/main/CHANGELOG.md"
"Roost (core)" = "https://github.com/ashhadahsan/roost"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.8",
    "uvicorn>=0.32",
]
