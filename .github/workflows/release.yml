name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/roost-web/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: drop local roost source override for build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pyproject.toml")
          text = p.read_text()
          import re
          new = re.sub(r"\[tool\.uv\.sources\][\s\S]*?(?=\n\[)", "", text, count=1)
          p.write_text(new)
          PY
      - run: uv build
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
