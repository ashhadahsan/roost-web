name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      # Use the published `roost` for CI rather than the workspace path.
      - name: drop local roost source override for CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pyproject.toml")
          text = p.read_text()
          # Strip [tool.uv.sources] block so CI installs roost from PyPI.
          import re
          new = re.sub(r"\[tool\.uv\.sources\][\s\S]*?(?=\n\[)", "", text, count=1)
          p.write_text(new)
          PY
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    name: py${{ matrix.python }} × pg${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        postgres: ["13", "14", "15", "16"]
    env:
      ROOST_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: drop local roost source override for CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pyproject.toml")
          text = p.read_text()
          import re
          new = re.sub(r"\[tool\.uv\.sources\][\s\S]*?(?=\n\[)", "", text, count=1)
          p.write_text(new)
          PY
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -n auto --maxfail=3
